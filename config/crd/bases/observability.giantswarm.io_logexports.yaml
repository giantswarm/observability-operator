---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: logexports.observability.giantswarm.io
spec:
  group: observability.giantswarm.io
  names:
    kind: LogExport
    listKind: LogExportList
    plural: logexports
    singular: logexport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.destination.type
      name: Destination
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          LogExport continuously copies a selection of the installation's logs to a
          destination outside the observability platform, for archival or for delivery to
          a system Giant Swarm does not run.

          Logs are teed off the write path, so an export can never slow down or break log
          ingestion. The same property makes delivery best-effort: if the exporter is
          unavailable, lines are dropped rather than queued, and there is no backfill.

          # Scope

          This resource is namespaced so that credentials stay next to it, but the
          namespace is NOT a data boundary: a LogExport in any namespace can select logs
          from every cluster on the installation. Permission to create one should be
          treated as privileged access to log data.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LogExportSpec defines the desired state of LogExport.
            properties:
              destination:
                description: Destination is where the selected lines are written.
                properties:
                  loki:
                    description: Loki configures a Loki-compatible push endpoint.
                      Required when type is "loki".
                    properties:
                      credentialsRef:
                        description: |-
                          CredentialsRef names a Secret holding basic-auth credentials, with keys
                          username and password.

                          The Secret is read from THIS resource's namespace; cross-namespace
                          references are not possible.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      tenantID:
                        description: |-
                          TenantID is sent as the X-Scope-OrgID header. Required by multi-tenant Loki
                          deployments, ignored by single-tenant ones.
                        maxLength: 150
                        type: string
                      url:
                        description: URL is the push endpoint, including the path.
                        example: https://logs.example.com/loki/api/v1/push
                        maxLength: 2048
                        minLength: 1
                        pattern: ^https?://.+$
                        type: string
                    required:
                    - url
                    type: object
                  s3:
                    description: S3 configures an S3 or S3-compatible bucket. Required
                      when type is "s3".
                    properties:
                      bucket:
                        description: Bucket is the destination bucket name.
                        maxLength: 63
                        minLength: 1
                        type: string
                      credentialsRef:
                        description: |-
                          CredentialsRef names a Secret holding static credentials, with keys
                          AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.

                          The Secret is read from THIS resource's namespace; cross-namespace
                          references are not possible. Omit it to authenticate by workload identity
                          (IRSA) instead, optionally combined with RoleARN.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      endpoint:
                        description: |-
                          Endpoint overrides the S3 endpoint. Leave empty for AWS; set it to target an
                          S3-compatible store.
                        maxLength: 2048
                        type: string
                      forcePathStyle:
                        description: |-
                          ForcePathStyle addresses the bucket as a path rather than a subdomain.
                          S3-compatible stores generally require this; AWS generally does not.
                        type: boolean
                      prefix:
                        description: |-
                          Prefix is the key prefix objects are written under. Object keys are
                          <prefix>/year=…/month=…/day=…/hour=…/minute=…/logs_<uuidv7>.txt.gz, using the
                          time the object was uploaded rather than the time of the events in it.
                        example: giantswarm/audit
                        maxLength: 512
                        type: string
                      region:
                        description: Region is the bucket's region.
                        example: eu-west-2
                        maxLength: 63
                        minLength: 1
                        type: string
                      roleARN:
                        description: |-
                          RoleARN is an IAM role to assume before writing, for cross-account delivery.
                          When set, CredentialsRef is usually unnecessary: the exporter authenticates
                          with its own ServiceAccount identity and assumes this role.
                        maxLength: 2048
                        pattern: ^$|^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+$
                        type: string
                    required:
                    - bucket
                    - region
                    type: object
                  type:
                    description: Type selects the destination variant.
                    enum:
                    - s3
                    - loki
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: spec.destination.s3 is required when type is 's3'
                  rule: self.type != 's3' || has(self.s3)
                - message: spec.destination.loki is required when type is 'loki'
                  rule: self.type != 'loki' || has(self.loki)
                - message: spec.destination.s3 may only be set when type is 's3'
                  rule: self.type == 's3' || !has(self.s3)
                - message: spec.destination.loki may only be set when type is 'loki'
                  rule: self.type == 'loki' || !has(self.loki)
              selector:
                description: |-
                  Selector chooses which log lines are exported, using LogQL syntax.

                  Only the subset the exporter can render is accepted: a stream selector with at
                  least one exact match, optional line filters, an optional "| json", and optional
                  label filters. Aggregations and time ranges are rejected -- an export is a
                  continuous tee, not a query, so it has no start or end.

                  The same expression can be pasted into Grafana Explore to see exactly which
                  lines it matches before committing it.

                  This is NOT limited by the namespace of this resource: a selector matches
                  against every log line arriving at the installation's write path, from any
                  cluster. See the LogExport type documentation.
                example: '{scrape_job="audit-logs"}'
                maxLength: 4096
                minLength: 1
                type: string
            required:
            - destination
            - selector
            type: object
          status:
            description: LogExportStatus defines the observed state of LogExport.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the export's state.
                  Types: Ready (the pipeline is configured), ExporterAvailable (alloy-logexporter
                  is running on this installation).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  was set from.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
