# This file was generated by observability-operator.
# It configures Alloy to archive selected logs to a destination outside the platform.
#
# - configMap is generated from alloy-logexporter.alloy.template and passed as a string here;
#   Alloy's chart creates the ConfigMap from it.
# - Alloy runs as a statefulset because otelcol.storage.file needs per-replica persistent
#   storage: it is the write-ahead log that carries buffered records through a destination
#   outage and across a pod restart.
# - alloy.enabled turns the app on; it ships disabled, which is what keeps it inert on
#   installations with no LogExport.
alloy:
  enabled: true

  # POD-level security context lives under `global`, not `controller` and not alongside
  # the container securityContext -- the pod template reads
  # `.Values.global.podSecurityContext`, so anywhere else silently does nothing. The
  # container runs as 473 but a freshly provisioned PVC is root-owned, so
  # without fsGroup Alloy fails to build otelcol.storage.file with
  # `mkdir /var/lib/alloy/wal: permission denied`.
  global:
    podSecurityContext:
      fsGroup: 473

  controller:
    type: statefulset
    replicas: 2
    volumeClaimTemplates:
      - metadata:
          name: wal
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              # Size for rate x timeout, not for throughput: this only has to hold what
              # accumulates while the destination is unavailable.
              storage: "10Gi"

  alloy:
    # otelcol.exporter.awss3 is experimental and otelcol.storage.file is in public
    # preview; Alloy refuses to load the config without this.
    stabilityLevel: experimental

    # ephemeral-storage is required by the require-emptydir-requests-and-limits Kyverno
    # policy, because the container mounts the alloy-tmp emptyDir.
    resources:
      limits:
        cpu: "1"
        ephemeral-storage: 2Gi
        memory: 1Gi
      requests:
        cpu: 100m
        ephemeral-storage: 1Gi
        memory: 400Mi

    # The chart's Service exposes only the 12345 metrics port, so the push endpoint has to
    # be added explicitly -- `extraPorts` puts it on both the container and the Service.
    # Without this the mirror backendRef resolves to a Service with no such port and every
    # mirrored request fails.
    extraPorts:
      - name: push
        port: 3100
        targetPort: 3100
        protocol: TCP

    # `mounts.extra` REPLACES the chart default rather than adding to it, so the chart's
    # own alloy-tmp entry has to be restated here. Without it Alloy crashes with
    # `mkdir /tmp/alloy: read-only file system`, because --storage.path defaults to
    # /tmp/alloy and readOnlyRootFilesystem is on.
    mounts:
      extra:
        - name: alloy-tmp
          mountPath: /tmp/alloy
        - name: wal
          mountPath: /var/lib/alloy

    configMap:
      create: true
      content: |-
        // This file was generated by observability-operator.
        //
        // Receives Loki push requests mirrored off the write path by an Envoy
        // HTTPRequestMirrorFilter and archives the selected lines to object storage.
        //
        // Requires --stability.level=experimental: otelcol.exporter.awss3 is experimental
        // and otelcol.storage.file is in public preview.
        loki.source.api "mirror" {
        	http {
        		listen_address = "0.0.0.0"
        		listen_port    = 3100
        	}
        	forward_to = [
        		loki.process.select_giantswarm_audit.receiver,
        	]
        }
        otelcol.storage.file "wal" {
        	directory = "/var/lib/alloy/wal"
        }
        // giantswarm/audit
        //
        // Selection is expressed as a DROP of the negated selector. stage.match with the default
        // action = "keep" does NOT drop non-matching entries -- it only gates its nested stages --
        // and it fails validation without one. Emitting one drop stage per negated term composes
        // as an AND of keeps.
        loki.process "select_giantswarm_audit" {
        	stage.match {
        		selector            = "{scrape_job!=\"audit-logs\"}"
        		action              = "drop"
        		drop_counter_reason = "not_selected"
        	}
        	forward_to = [otelcol.receiver.loki.to_giantswarm_audit.receiver]
        }
        otelcol.receiver.loki "to_giantswarm_audit" {
        	output {
        		logs = [otelcol.exporter.awss3.giantswarm_audit.input]
        	}
        }
        otelcol.exporter.awss3 "giantswarm_audit" {
        	// This exporter does not expose retry_on_failure and it is disabled, so `timeout` is
        	// the durability window: an object-store outage longer than this loses data
        	// permanently, whatever the queue holds.
        	timeout = "5m"
        	marshaler {
        		type = "otlp_json"
        	}
        	sending_queue {
        		enabled = true
        		storage = otelcol.storage.file.wal.handler
        		// The queue sits before the batcher and holds one entry per Loki entry. The
        		// defaults (sizer = "requests", queue_size = 1000, block_on_overflow = false) are
        		// well under a second of buffer at installation scale and drop silently, visible
        		// only in otelcol_exporter_enqueue_failed_log_records_total.
        		sizer             = "items"
        		queue_size        = 200000
        		block_on_overflow = true
        		num_consumers     = 4
        		// Mandatory. otelcol.receiver.loki calls ConsumeLogs once per entry, so without
        		// batching every single log line becomes its own object.
        		batch {
        			sizer         = "items"
        			min_size      = 1000
        			max_size      = 10000
        			flush_timeout = "60s"
        		}
        	}
        	s3_uploader {
        		region                = "us-east-1"
        		s3_bucket             = "audit-export"
        		// Required by the exporter even though the CRD's prefix is optional: omitting the
        		// attribute fails the config load, which would stop every export on the
        		// installation. Empty means objects start at the bucket root.
        		s3_prefix             = "giantswarm/audit"
        		endpoint              = "http://minio.spike03.svc.cluster.local:9000"
        		s3_force_path_style   = true
        		// Cross-account delivery: the exporter authenticates with its own ServiceAccount
        		// identity and assumes this role.
        		role_arn              = "arn:aws:iam::123456789012:role/log-archive-writer"
        		compression           = "gzip"
        		unique_key_func_name  = "uuidv7"
        		// Partition keys are built from upload time in the pod's local zone unless pinned,
        		// so leaving this unset makes partitioning depend on the pod.
        		s3_partition_timezone = "UTC"
        		retry_max_attempts    = 10
        		retry_max_backoff     = "5m"
        	}
        }

    # The destination credentials are NOT here: they arrive as a separate valuesFrom
    # Secret carrying extraSecretEnv, which alloy-app turns into a Secret named after the
    # release.
    #
    # That Secret has to reach the container as environment variables, because the awss3
    # exporter has no credential fields -- it uses the AWS SDK's default chain. This is
    # unlike the other collectors, whose credentials are read from a Secret at runtime by
    # `remote.kubernetes.secret` and so never need to be in the environment.
    #
    # optional: true so the release still starts when no credentials Secret exists, which
    # is the case when the destination is reached with IRSA instead.
    envFrom:
      - secretRef:
          name: alloy-logexporter
          optional: true

# Cilium denies all egress when the rules are empty, so the exporter needs explicit
# permission to reach DNS and the destination.
networkPolicy:
  flavor: cilium
  cilium:
    # The chart's DEFAULT ingress allows port 12345 only, so without this the push
    # endpoint is unreachable and every mirrored request fails -- silently, because
    # Envoy's mirror is fire-and-forget. Setting `ingress` replaces the default wholesale,
    # so 12345 has to be restated or metrics scraping breaks.
    ingress:
      # Prometheus scraping (the chart default, restated)
      - toPorts:
          - ports:
              - port: "12345"
                protocol: TCP
      # Mirrored Loki pushes from the Envoy gateway
      - fromEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: envoy-gateway-system
        toPorts:
          - ports:
              - port: "3100"
                protocol: TCP
    egress:
      - toEntities:
          - kube-apiserver
          - cluster
          - world
      - toEndpoints:
          - matchLabels:
              k8s-app: coredns
          - matchLabels:
              k8s-app: k8s-dns-node-cache
        toPorts:
          - ports:
              - port: "1053"
                protocol: UDP
              - port: "1053"
                protocol: TCP
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP

kyvernoPolicyExceptions:
  enabled: true
