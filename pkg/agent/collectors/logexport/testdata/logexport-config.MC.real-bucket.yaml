# This file was generated by observability-operator.
# It configures Alloy to archive audit and Teleport logs to object storage.
#
# - configMap is generated from logexport.alloy.template and passed as a string
#   here; Alloy's chart creates the ConfigMap from it.
# - Alloy runs as a statefulset because otelcol.storage.file needs per-replica
#   persistent storage: it is the write-ahead log that carries buffered records
#   through an object-store outage and across a pod restart.
# - alloy.enabled overrides the `false` shipped by management-cluster-bases
#   collections, which is what keeps this app inert on installations that have not
#   enabled log export.
alloy:
  enabled: true

  controller:
    type: statefulset
    replicas: 2
    volumeClaimTemplates:
      - metadata:
          name: wal
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              # Size for rate x timeout, not for throughput: this only has to hold
              # what accumulates while the destination is unavailable.
              storage: "10Gi"

  alloy:
    # otelcol.exporter.awss3 is experimental and otelcol.storage.file is in public
    # preview; Alloy refuses to load the config without this.
    stabilityLevel: experimental

    resources:
      requests:
        cpu: "100m"
        memory: "400Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

    mounts:
      extra:
        - name: wal
          mountPath: /var/lib/alloy

    configMap:
      create: true
      content: |-
        // This file was generated by observability-operator.
        //
        // Receives Loki push requests mirrored off the write path by an Envoy
        // HTTPRequestMirrorFilter and archives the selected lines to object storage.
        //
        // Requires --stability.level=experimental: otelcol.exporter.awss3 is experimental
        // and otelcol.storage.file is in public preview.
        loki.source.api "mirror" {
        	http {
        		listen_address = "0.0.0.0"
        		listen_port    = 3100
        	}
        	forward_to = [loki.process.select.receiver]
        }
        loki.process "select" {
        	// Selection is expressed as a DROP of the negated selector. `stage.match` with
        	// the default action = "keep" does NOT drop non-matching entries -- it only
        	// gates its nested stages -- and it fails validation without one. Emitting one
        	// drop stage per negated term composes as an AND of keeps.
        	stage.match {
        		selector            = "{scrape_job!=\"audit-logs\"}"
        		action              = "drop"
        		drop_counter_reason = "not_selected"
        	}
        	forward_to = [otelcol.receiver.loki.to_s3.receiver]
        }
        otelcol.receiver.loki "to_s3" {
        	output {
        		logs = [otelcol.processor.transform.inject.input]
        	}
        }
        // A Kubernetes audit event carries no cluster identifier of its own, and the
        // `body` marshaler writes only the log line, dropping every Loki label. Without
        // this the archive cannot be attributed to a cluster.
        otelcol.processor.transform "inject" {
        	error_mode = "ignore"
        	log_statements {
        		context = "log"
        		statements = [
        			`set(body, Concat([Substring(body, 0, Len(body) - 1), ",\"gs_cluster_id\":\"", attributes["cluster_id"], "\"}"], ""))`,
        		]
        	}
        	output {
        		logs = [otelcol.exporter.awss3.customer.input]
        	}
        }
        otelcol.storage.file "wal" {
        	directory = "/var/lib/alloy/wal"
        }
        otelcol.exporter.awss3 "customer" {
        	// This operator's awss3 exporter does not expose retry_on_failure and it is
        	// disabled, so `timeout` is the durability window: an object-store outage
        	// longer than this loses data permanently.
        	timeout = "5m"
        	marshaler {
        		// Raw log lines, newline-delimited -- directly queryable as NDJSON.
        		type = "body"
        	}
        	sending_queue {
        		enabled = true
        		storage = otelcol.storage.file.wal.handler
        		// The queue sits before the batcher and holds one entry per Loki entry.
        		// The defaults (sizer = "requests", queue_size = 1000, block_on_overflow =
        		// false) are well under a second of buffer at installation scale and drop
        		// silently, visible only in otelcol_exporter_enqueue_failed_log_records_total.
        		sizer             = "items"
        		queue_size        = 200000
        		block_on_overflow = true
        		num_consumers     = 4
        		// Mandatory. otelcol.receiver.loki calls ConsumeLogs once per entry, so
        		// without batching every single log line becomes its own object.
        		batch {
        			sizer         = "items"
        			min_size      = 1000
        			max_size      = 10000
        			flush_timeout = "60s"
        		}
        	}
        	s3_uploader {
        		region                = "eu-west-2"
        		s3_bucket             = "customer-audit-archive"
        		s3_prefix             = "giantswarm/audit"
        		compression           = "gzip"
        		unique_key_func_name  = "uuidv7"
        		// Partition keys are built from upload time in the pod's local zone unless
        		// pinned, so leaving this unset makes partitioning depend on the pod.
        		s3_partition_timezone = "UTC"
        		retry_max_attempts    = 10
        		retry_max_backoff     = "5m"
        	}
        }

    # The object store credentials themselves are NOT here: they arrive as a
    # separate valuesFrom Secret rendered by pkg/agent/common/secret.go, which
    # alloy-app turns into a Secret named after the release.
    #
    # That Secret has to reach the container as environment variables, because the
    # awss3 exporter has no credential fields -- it uses the AWS SDK's default
    # chain. This is unlike the other collectors, whose credentials are read from a
    # Secret at runtime by `remote.kubernetes.secret` and so never need to be in the
    # environment.
    #
    # optional: true so the release still starts when no credentials Secret exists,
    # which is the case when the destination is reached with IRSA instead.
    envFrom:
      - secretRef:
          name: alloy-logexporter
          optional: true

# Cilium denies all egress when the rules are empty, so the exporter needs explicit
# permission to reach DNS and the object store.
networkPolicy:
  flavor: cilium
  cilium:
    egress:
      - toEntities:
          - kube-apiserver
          - cluster
          - world
      - toEndpoints:
          - matchLabels:
              k8s-app: coredns
          - matchLabels:
              k8s-app: k8s-dns-node-cache
        toPorts:
          - ports:
              - port: "1053"
                protocol: UDP
              - port: "1053"
                protocol: TCP
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP

kyvernoPolicyExceptions:
  enabled: true
