version: 2.1

orbs:
  architect: giantswarm/architect@10.17.4

jobs:
  template-chart:
    docker:
    - image: giantswarm/helm-chart-testing:v3.14.0
    steps:
    - checkout
    - run: cd helm/observability-operator && helm dep up
    - run: helm template helm/observability-operator
    # Render the CRDs without webhooks, which drops GrafanaOrganization v1alpha1.
    - run: helm template helm/observability-operator --set webhook.enabled=false
  validate-alertmanager-config:
    executor: architect/architect
    steps:
    - checkout
    - run:
        name: Validate Alertmanager Config
        command: make validate-alertmanager-config
  verify-generate:
    executor: architect/architect
    steps:
    - checkout
    - run:
        name: Validate generated files
        command: make verify-generate
workflows:
  build:
    jobs:

    # This job is used to build the Helm chart and make sure it is valid.
    - template-chart:
        name: template-chart
        filters:
          tags:
            only: /^v.*/

    # This job is used to validate the Alertmanager config.
    # It requires the template-chart job to be run first because it needs
    # the chart to be a valid Helm chart to generate the Alertmanager config to validate.
    - validate-alertmanager-config:
        name: validate-alertmanager-config
        requires:
        - template-chart
        filters:
          tags:
            only: /^v.*/

    # This job validates that generated files (CRDs, RBAC, deepcopy, etc.) are up to date.
    - verify-generate:
        name: verify-generate
        filters:
          tags:
            only: /^v.*/

    # Run the unit and envtest suites, then build the observability-operator binary.
    - architect/go-build:
        context: architect
        name: go-build
        resource_class: large
        test_target: test GINKGO_NODES=2
        path: ./cmd
        binary: observability-operator
        filters:
          tags:
            only: /^v.*/

    # Push the observability-operator container image.
    - architect/push-to-registries:
        context: architect
        name: push-to-registries
        # Skip the trans-Pacific Aliyun push in-line; the sync-china-registry
        # job below mirrors gsoci -> Aliyun from an in-China runner in parallel.
        split-china-push: true
        requires:
        - go-build
        - validate-alertmanager-config
        - verify-generate
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main
            - master

    # Mirror gsoci -> Aliyun via the in-China giantswarm/galaxy-runner, off the
    # push-to-registries critical path. Tag builds only (dev images don't push
    # to Aliyun).
    - architect/sync-china-registry:
        context: architect
        name: sync-china-registry
        requires:
        - push-to-registries
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/

    # Push the observability-operator Helm chart.
    - architect/push-to-app-catalog:
        context: architect
        executor: app-build-suite
        name: push-to-app-catalog
        app_catalog: control-plane-catalog
        app_catalog_test: control-plane-test-catalog
        chart: observability-operator
        persist_chart_archive: true
        requires:
        - push-to-registries
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main
            - master

    # Run end to end tests.
    - architect/run-tests-with-ats:
        name: run-chart-tests-with-ats
        app-test-suite_container_tag: "1.1.0"
        create_kind_cluster: true
        filters:
            # Do not trigger the job on merge to main.
          branches:
            ignore:
            - main
        requires:
        - push-to-app-catalog
